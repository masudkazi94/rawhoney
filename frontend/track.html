<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — Sahyadri Honey</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer">🍯 Sahyadri Honey</div>
    <nav class="nav-links">
      <button id="btn-orders" class="nav-btn">Previous Orders</button>
      <button id="btn-track" class="nav-btn">Track Orders</button>
      <button id="btn-cart" class="nav-btn cart-btn">🛒 Cart <span id="cart-count" class="cart-count">0</span></button>
      <button id="btn-login" class="nav-btn login-btn">Login</button>
      <button id="btn-logout" class="nav-btn logout-btn hidden">Logout</button>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Track Your Order</h2>

    <div class="track-search">
      <input type="text" id="order-id" placeholder="Enter Order ID (e.g. ORD-1002)" />
      <button id="track-btn" class="checkout-btn" style="width:auto;padding:10px 20px;">Track</button>
    </div>

    <div id="track-result" class="track-result hidden">
      <div class="timeline">
        <div class="step done"><span></span><p>Order Placed</p></div>
        <div class="step done"><span></span><p>Packed</p></div>
        <div class="step active"><span></span><p>In Transit</p></div>
        <div class="step"><span></span><p>Out for Delivery</p></div>
        <div class="step"><span></span><p>Delivered</p></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById("track-btn").addEventListener("click", () => {
      const id = document.getElementById("order-id").value.trim();
      if (!id) {
        showToast("Enter an Order ID");
        return;
      }
      document.getElementById("track-result").classList.remove("hidden");
      showToast(`Showing status for ${id}`);
    });
  </script>
</body>
</html>
